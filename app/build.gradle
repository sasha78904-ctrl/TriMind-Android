plugins {
    id 'com.android.application'
}

android {
    namespace 'com.trimind.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.trimind.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
