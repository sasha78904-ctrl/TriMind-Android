name: ECU archive inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gdown==5.2.0
      - run: mkdir -p work output
      - run: python -m gdown --id 1SPdx7toePUG4HfhcEbL3OulG5F2gwWSk --output work/backup.zip
      - run: python tools/index_ecu_zip.py work/backup.zip output
      - uses: actions/upload-artifact@v4
        with:
          name: ecu-inventory
          path: output/
