name: ECU archive inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gdown==5.2.0
      - run: mkdir -p work output
      - run: python -m gdown --id 1SPdx7toePUG4HfhcEbL3OulG5F2gwWSk --output work/backup.zip
      - name: Identify archive and diagnose ZIP signatures
        run: |
          file work/backup.zip
          python - <<'PY'
          from pathlib import Path
          p=Path("work/backup.zip")
          with p.open("rb") as f:
              start=f.read(32)
              f.seek(max(0,p.stat().st_size-65557))
              tail=f.read()
          print("File size:",p.stat().st_size)
          print("Header (hex):",start.hex())
          print("ZIP EOCD in last 65557 bytes:",tail.rfind(b'PK\\x05\\x06'))
          print("ZIP64 locator:",tail.rfind(b'PK\\x06\\x07'))
          PY
      - name: Standard ZIP indexing
        id: normal
        continue-on-error: true
        run: python tools/index_ecu_zip.py work/backup.zip output
      - name: Forensic local-header inventory
        if: steps.normal.outcome == 'failure'
        run: python tools/recover_zip_index.py work/backup.zip output
      - name: Upload reports even when standard indexing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecu-inventory
          path: output/
